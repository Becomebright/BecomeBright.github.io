<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 25 608 345" width="608" height="345" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="16" y="25" width="608" height="345" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <g id="obj">
      <circle cx="0" cy="-21" r="10" fill="#334155"/>
      <rect x="-13" y="-8" width="26" height="34" rx="9" fill="#334155"/>
    </g>
  </defs>
  <g transform="translate(0,10)">

  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="30" text-anchor="middle">
    <text x="108" y="50" fill="#3b82f6">Template</text>
    <text x="320" y="50" fill="#d97706">Reference</text>
    <text x="532" y="50" fill="#0f172a">Search</text>
  </g>

  <!-- frame 1: initial frame, template crop (long-term) -->
  <rect x="24" y="66" width="168" height="128" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <rect x="84" y="95" width="48" height="74" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="4"/>
  <use href="#obj" x="108" y="130"/>

  <!-- frame t-k: recent frame, reference region (short-term) -->
  <rect x="236" y="66" width="168" height="128" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <rect x="270" y="84" width="100" height="94" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
  <use href="#obj" transform="translate(320,132) rotate(22)"/>

  <!-- frame t: current search frame, target + distractor -->
  <rect x="448" y="66" width="168" height="128" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="3"/>
  <use href="#obj" transform="translate(500,132) rotate(28)"/>
  <use href="#obj" x="574" y="132"/>
  <rect x="468" y="92" width="66" height="80" rx="6" fill="none" stroke="#16a34a" stroke-width="5"/>

  <!-- arrows -->
  <g fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round">
    <path d="M108,204 C108,290 160,316 226,316" marker-end="url(#ah)"/>
    <path d="M320,204 L320,268" marker-end="url(#ah)"/>
    <path d="M400,316 C470,316 532,290 532,212" marker-end="url(#ah)"/>
  </g>

  <!-- Linker -->
  <rect x="240" y="280" width="160" height="72" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="320" y="327" font-family="Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="34" text-anchor="middle" fill="#0f172a">Linker</text>

  <g font-family="Inter, Helvetica, Arial, sans-serif" font-weight="600" font-size="26" fill="#475569">
    <text x="130" y="252">long-term</text>
    <text x="334" y="252">short-term</text>
  </g>
  </g>
</svg>
