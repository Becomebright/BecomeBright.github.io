<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 6 694 388" width="694" height="388" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="-2" y="6" width="694" height="388" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <!-- cat silhouette, local coords: centre x=75, feet at y=114 -->
    <path id="catBody" d="M52 114 C40 104 42 80 58 68 C54 62 54 50 58 44 L58 22 L71 35 L79 35 L92 22 L92 44 C96 50 96 62 92 68 C108 80 110 104 98 114 Z"/>
    <path id="catTail" d="M96 112 C118 113 128 98 120 82"/>
    <clipPath id="c150"><rect width="150" height="150" rx="12"/></clipPath>
    <!-- magma colormap for depth: far (top, dark) -> near (bottom, bright) -->
    <linearGradient id="magmaGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#51127c"/>
      <stop offset="0.35" stop-color="#b73779"/>
      <stop offset="0.7" stop-color="#fc8961"/>
      <stop offset="1" stop-color="#fcfdbf"/>
    </linearGradient>
    <!-- two cats: A near/left/large, B far/right/small -->
    <g id="catA" transform="translate(50 124) scale(0.78) translate(-75 -114)">
      <use href="#catTail" fill="none" stroke-width="9" stroke-linecap="round"/>
      <use href="#catBody"/>
    </g>
    <g id="catB" transform="translate(112 106) scale(0.5) translate(-75 -114)">
      <use href="#catTail" fill="none" stroke-width="9" stroke-linecap="round"/>
      <use href="#catBody"/>
    </g>
  </defs>

  <!-- ===== input photo (two cats) ===== -->
  <g transform="translate(6,110) scale(1.2)">
    <g clip-path="url(#c150)">
      <rect width="150" height="150" fill="#dbeafe"/>
      <rect y="96" width="150" height="54" fill="#bbf7d0"/>
      <circle cx="126" cy="30" r="13" fill="#fcd34d"/>
      <g fill="#d97706" stroke="#d97706"><use href="#catA"/></g>
      <g fill="#64748b" stroke="#64748b"><use href="#catB"/></g>
    </g>
    <rect width="150" height="150" rx="12" fill="none" stroke="#64748b" stroke-width="2.6"/>
  </g>

  <!-- ===== prompt pill ===== -->
  <rect x="226" y="34" width="200" height="56" rx="28" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="326" y="71" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0f172a">text prompt</text>

  <!-- ===== arrows into generator ===== -->
  <line x1="326" y1="94" x2="326" y2="150" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
  <line x1="194" y1="200" x2="232" y2="200" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- ===== generator ===== -->
  <rect x="238" y="158" width="176" height="124" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
  <text x="326" y="213" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Image</text>
  <text x="326" y="248" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Generator</text>
  <circle cx="412" cy="160" r="17" fill="#ef4444"/>
  <text x="412" y="169" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">?</text>

  <!-- ===== branch to outputs ===== -->
  <path d="M414 220 H440 M440 72 V328" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <line x1="440" y1="72" x2="464" y2="72" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
  <line x1="440" y1="200" x2="464" y2="200" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
  <line x1="440" y1="328" x2="464" y2="328" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- Mask (referring segmentation) -->
  <g transform="translate(472,14) scale(0.773)">
    <g clip-path="url(#c150)">
      <rect width="150" height="150" fill="#0f172a"/>
      <g fill="#ffffff" stroke="#ffffff"><use href="#catA"/></g>
    </g>
    <rect width="150" height="150" rx="12" fill="none" stroke="#16a34a" stroke-width="5"/>
  </g>

  <!-- Depth (magma, brighter = closer) -->
  <g transform="translate(472,142) scale(0.773)">
    <g clip-path="url(#c150)">
      <rect width="150" height="150" fill="#1d1147"/>
      <rect y="96" width="150" height="54" fill="url(#magmaGround)"/>
      <g fill="#e75263" stroke="#e75263"><use href="#catB"/></g>
      <g fill="#fec287" stroke="#fec287"><use href="#catA"/></g>
    </g>
    <rect width="150" height="150" rx="12" fill="none" stroke="#7c3aed" stroke-width="5"/>
  </g>

  <!-- Count (red dots on each instance) -->
  <g transform="translate(472,270) scale(0.773)">
    <g clip-path="url(#c150)">
      <rect width="150" height="150" fill="#dbeafe"/>
      <rect y="96" width="150" height="54" fill="#bbf7d0"/>
      <g fill="#d97706" stroke="#d97706" opacity="0.55"><use href="#catA"/></g>
      <g fill="#64748b" stroke="#64748b" opacity="0.55"><use href="#catB"/></g>
      <circle cx="50" cy="100" r="13" fill="#ef4444" stroke="#ffffff" stroke-width="4"/>
      <circle cx="112" cy="90" r="11" fill="#ef4444" stroke="#ffffff" stroke-width="3.5"/>
    </g>
    <rect width="150" height="150" rx="12" fill="none" stroke="#3b82f6" stroke-width="5"/>
  </g>

  <!-- output labels -->
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">
    <text x="606" y="81">Mask</text>
    <text x="606" y="209">Depth</text>
    <text x="606" y="337">Count</text>
  </g>
</svg>
