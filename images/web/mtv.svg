<svg xmlns="http://www.w3.org/2000/svg" viewBox="12 22 731 354" width="731" height="354" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="12" y="22" width="731" height="354" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <!-- magma colormap (far = dark, near = bright) -->
    <linearGradient id="magma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1147"/>
      <stop offset="0.45" stop-color="#51127c"/>
      <stop offset="0.7" stop-color="#b73779"/>
      <stop offset="0.88" stop-color="#fc8961"/>
      <stop offset="1" stop-color="#fcfdbf"/>
    </linearGradient>
    <clipPath id="tileL"><rect x="382" y="42" width="72" height="58" rx="6"/></clipPath>
    <clipPath id="tileR"><rect x="466" y="42" width="72" height="58" rx="6"/></clipPath>
  </defs>


  <!-- ===== SigLIP: image-text contrastive ===== -->
  <rect x="175" y="30" width="180" height="162" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <rect x="196" y="46" width="50" height="50" rx="7" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
  <path d="M200 92 L215 74 L226 85 L234 77 L243 92 Z" fill="#3b82f6"/>
  <circle cx="234" cy="58" r="5" fill="#3b82f6"/>
  <!-- matching arrows -->
  <path d="M254 64 H276 M254 78 H276" stroke="#334155" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M270 59 L277 64 L270 69 M260 73 L253 78 L260 83" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- text lines -->
  <path d="M288 56 H334 M288 71 H326 M288 86 H332" stroke="#3b82f6" stroke-width="6.5" stroke-linecap="round"/>
  <text x="265" y="142" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="29" font-weight="700" fill="#0f172a">Image–Text</text>
  <text x="265" y="174" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">SigLIP</text>

  <!-- ===== Dense: depth + grounding (expert pseudo-labels) ===== -->
  <rect x="363" y="30" width="195" height="162" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <!-- depth tile: magma scene with a near object -->
  <g clip-path="url(#tileL)">
    <rect x="382" y="42" width="72" height="58" fill="url(#magma)"/>
    <ellipse cx="408" cy="94" rx="15" ry="4" fill="#fcfdbf" opacity="0.6"/>
    <rect x="396" y="64" width="24" height="30" rx="8" fill="#fec287"/>
    <circle cx="408" cy="60" r="9" fill="#fec287"/>
    <rect x="436" y="70" width="10" height="20" rx="4" fill="#b73779"/>
    <circle cx="441" cy="66" r="5" fill="#b73779"/>
  </g>
  <rect x="382" y="42" width="72" height="58" rx="6" fill="none" stroke="#d97706" stroke-width="3"/>
  <!-- grounding tile: object with labelled box -->
  <g clip-path="url(#tileR)">
    <rect x="466" y="42" width="72" height="58" fill="#e0f2fe"/>
    <rect x="466" y="86" width="72" height="14" fill="#bbf7d0"/>
    <rect x="484" y="66" width="24" height="26" rx="8" fill="#64748b"/>
    <circle cx="496" cy="61" r="8" fill="#64748b"/>
  </g>
  <rect x="478" y="56" width="36" height="40" rx="3" fill="none" stroke="#ef4444" stroke-width="3.5"/>
  <rect x="478" y="45" width="24" height="12" rx="2" fill="#ef4444"/>
  <rect x="466" y="42" width="72" height="58" rx="6" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="460" y="142" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Dense</text>
  <text x="460" y="174" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">depth · grounding</text>

  <!-- ===== SSL: masked patches / self-distillation ===== -->
  <rect x="568" y="30" width="167" height="162" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <g stroke="#ffffff" stroke-width="3">
    <rect x="600" y="46" width="25" height="25" fill="#c4b5fd"/>
    <rect x="625" y="46" width="25" height="25" fill="#7c3aed"/>
    <rect x="650" y="46" width="25" height="25" fill="#c4b5fd"/>
    <rect x="675" y="46" width="25" height="25" fill="#c4b5fd"/>
    <rect x="600" y="71" width="25" height="25" fill="#c4b5fd"/>
    <rect x="625" y="71" width="25" height="25" fill="#c4b5fd"/>
    <rect x="650" y="71" width="25" height="25" fill="#7c3aed"/>
    <rect x="675" y="71" width="25" height="25" fill="#7c3aed"/>
  </g>
  <text x="650" y="142" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">SSL</text>
  <text x="650" y="174" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#475569">DINO · iBOT</text>

  <!-- ===== arrows: encoder -> objectives ===== -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)">
    <line x1="265" y1="250" x2="265" y2="200"/>
    <line x1="460" y1="250" x2="460" y2="200"/>
    <line x1="650" y1="250" x2="650" y2="200"/>
  </g>

  <!-- ===== input image ===== -->
  <rect x="20" y="240" width="128" height="128" rx="12" fill="#dbeafe"/>
  <path d="M20 332 L62 286 L92 316 L112 296 L148 332 V356 A12 12 0 0 1 136 368 H32 A12 12 0 0 1 20 356 Z" fill="#86efac"/>
  <circle cx="118" cy="268" r="12" fill="#fcd34d"/>
  <rect x="20" y="240" width="128" height="128" rx="12" fill="none" stroke="#64748b" stroke-width="3"/>
  <line x1="152" y1="304" x2="168" y2="304" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- ===== shared encoder ===== -->
  <rect x="175" y="258" width="560" height="92" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  <text x="455" y="316" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Shared Image Encoder</text>
</svg>
