<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 45 608 291" width="608" height="291" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="16" y="45" width="608" height="291" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- stream of frames (oldest back, newest front) -->
  <g stroke="#64748b" stroke-width="3" stroke-linejoin="round">
    <rect x="24" y="142" width="72" height="56" rx="8" fill="#f1f5f9"/>
    <rect x="38" y="160" width="72" height="56" rx="8" fill="#f1f5f9"/>
    <rect x="52" y="178" width="72" height="56" rx="8" fill="#ffffff"/>
  </g>
  <!-- tiny scene on newest frame -->
  <path d="M60,226 L78,204 L90,216 L100,206 L116,226 Z" fill="#94a3b8"/>
  <circle cx="104" cy="192" r="5" fill="#94a3b8"/>

  <!-- time arrow + label -->
  <line x1="28" y1="262" x2="118" y2="262" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>
  <text x="72" y="300" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#475569">stream</text>

  <!-- frames -> backbone -->
  <line x1="130" y1="200" x2="152" y2="200" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- backbone -->
  <text x="218" y="82" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a">OmniStream</text>
  <rect x="160" y="108" width="116" height="184" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <!-- KV-cache stack -->
  <g fill="#ffffff" stroke="#3b82f6" stroke-width="3">
    <rect x="182" y="136" width="72" height="20" rx="5"/>
    <rect x="182" y="167" width="72" height="20" rx="5"/>
    <rect x="182" y="198" width="72" height="20" rx="5"/>
    <rect x="182" y="229" width="72" height="20" rx="5" fill="#3b82f6"/>
  </g>
  <!-- persistent-state loop under the box -->
  <path d="M248,292 C248,338 188,338 188,300" fill="none" stroke="#334155" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)"/>

  <!-- fork to outputs -->
  <g fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)">
    <path d="M280,200 C304,200 296,110 318,110"/>
    <line x1="280" y1="200" x2="318" y2="200"/>
    <path d="M280,200 C304,200 296,290 318,290"/>
  </g>

  <!-- outputs -->
  <g stroke-width="3">
    <rect x="326" y="74" width="290" height="72" rx="13" fill="#dcfce7" stroke="#16a34a"/>
    <rect x="326" y="164" width="290" height="72" rx="13" fill="#fef3c7" stroke="#d97706"/>
    <rect x="326" y="254" width="290" height="72" rx="13" fill="#ede9fe" stroke="#7c3aed"/>
  </g>

  <!-- eye icon -->
  <g fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linejoin="round">
    <path d="M340,110 Q362,88 384,110 Q362,132 340,110 Z" fill="#ffffff"/>
    <circle cx="362" cy="110" r="7" fill="#16a34a"/>
  </g>
  <!-- cube icon -->
  <g fill="none" stroke="#d97706" stroke-width="3" stroke-linejoin="round">
    <path d="M362,179 L382,189 L382,211 L362,221 L342,211 L342,189 Z" fill="#ffffff"/>
    <path d="M342,189 L362,199 L382,189 M362,199 L362,221"/>
  </g>
  <!-- gripper icon -->
  <g fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="362" y1="270" x2="362" y2="284"/>
    <line x1="346" y1="284" x2="378" y2="284"/>
    <path d="M346,284 L346,304 L352,312"/>
    <path d="M378,284 L378,304 L372,312"/>
  </g>

  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#0f172a">
    <text x="398" y="119">Perception</text>
    <text x="398" y="209">Reconstruction</text>
    <text x="398" y="299">Action</text>
  </g>
</svg>
