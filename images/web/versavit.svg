<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 30 604 340" width="604" height="340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="18" y="30" width="604" height="340" fill="#ffffff"/>
